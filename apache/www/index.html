<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observability Demo</title>
  <link rel="icon" href="data:,">
  <script src="/config.js"></script>
  <script>
    (function bootstrapDdRum(windowRef, documentRef) {
      const ddRumConfig = windowRef.APP_CONFIG && windowRef.APP_CONFIG.ddRum;

      if (
        !ddRumConfig ||
        !ddRumConfig.applicationId ||
        !ddRumConfig.clientToken ||
        !ddRumConfig.sdkUrl
      ) {
        return;
      }

      const ddRum = windowRef.DD_RUM = windowRef.DD_RUM || {
        q: [],
        onReady: function onReady(callback) {
          ddRum.q.push(callback);
        },
      };

      ddRum.onReady(function initializeDdRum() {
        windowRef.DD_RUM.init({
          applicationId: ddRumConfig.applicationId,
          clientToken: ddRumConfig.clientToken,
          site: ddRumConfig.site,
          service: ddRumConfig.service,
          env: ddRumConfig.env,
          version: ddRumConfig.version,
          sessionSampleRate: ddRumConfig.sessionSampleRate,
          sessionReplaySampleRate: ddRumConfig.sessionReplaySampleRate,
          trackResources: ddRumConfig.trackResources,
          trackUserInteractions: ddRumConfig.trackUserInteractions,
          trackLongTasks: ddRumConfig.trackLongTasks,
          defaultPrivacyLevel: ddRumConfig.defaultPrivacyLevel,
          allowedTracingUrls: ddRumConfig.allowedTracingUrls,
        });

        if (ddRumConfig.team) {
          windowRef.DD_RUM.setGlobalContextProperty("team", ddRumConfig.team);
        }
        if (ddRumConfig.application) {
          windowRef.DD_RUM.setGlobalContextProperty("application", ddRumConfig.application);
        }
      });

      const rumSdkScript = documentRef.createElement("script");
      const firstScript = documentRef.getElementsByTagName("script")[0];

      rumSdkScript.src = ddRumConfig.sdkUrl;
      rumSdkScript.async = false;
      firstScript.parentNode.insertBefore(rumSdkScript, firstScript);
    })(window, document);
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>App CRUD Integrada com RabbitMQ</h1>
      <p>Appoena</p>
    </section>

    <div id="status" class="status"></div>

    <section class="grid">
      <div class="card">
        <h2 id="form-title">Criar item</h2>
        <form id="item-form">
          <input type="hidden" id="item-id">
          <div>
            <label for="name">Nome</label>
            <input id="name" name="name" required maxlength="120">
          </div>
          <div>
            <label for="description">Descrição</label>
            <textarea id="description" name="description" maxlength="500"></textarea>
          </div>
          <div>
            <label for="status-field">Status</label>
            <select id="status-field" name="status">
              <option value="PENDENTE">Pendente</option>
              <option value="feito">Feito</option>
            </select>
          </div>
          <button type="submit">Salvar</button>
          <button type="button" class="secondary" id="cancel-button">Limpar</button>
        </form>
      </div>

      <div class="card">
        <h2>Itens</h2>
        <div id="items" class="items"></div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
